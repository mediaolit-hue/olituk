<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Olit | Discussion Board</title>
    <style>
        :root {
            --bg-cream: #fbf9f5;
            --border-sharp: #111111;
            --text-main: #111111;
            --text-muted: #555555;
            --board-header: #700000;
        }
        body {
            font-family: Georgia, "Times New Roman", serif;
            background-color: var(--bg-cream);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            min-height: 100vh;
        }
        .header-container {
            max-width: 1350px;
            margin: 0 auto 15px auto;
            border-bottom: 3px solid var(--border-sharp);
            padding-bottom: 12px;
        }
        .brand-title {
            margin: 0;
            font-size: 2.2rem;
            text-transform: uppercase;
            font-weight: 700;
        }
        .global-nav {
            max-width: 1350px;
            margin: 0 auto 25px auto;
            padding: 10px 0;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #ddd;
        }
        .global-nav a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            margin: 0 12px;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .new-thread-box {
            background-color: #ffffff;
            border: 1px solid var(--border-sharp);
            padding: 15px;
            margin-bottom: 30px;
        }
        .new-thread-box h3 {
            margin-top: 0;
            font-size: 1rem;
            text-transform: uppercase;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .form-group input[type="text"], .form-group textarea {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            font-family: inherit;
        }
        .btn-submit {
            background-color: var(--border-sharp);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        .btn-submit:hover {
            background-color: var(--board-header);
        }
        
        /* Thread & Post Styling */
        .thread {
            background-color: #ffffff;
            border: 1px solid var(--border-sharp);
            padding: 15px;
            margin-bottom: 25px;
        }
        .post-header {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
        }
        .post-subject {
            color: var(--board-header);
            font-weight: bold;
            font-size: 1rem;
        }
        .poster-name {
            color: #117743;
            font-weight: bold;
        }
        .post-number {
            color: var(--text-muted);
            font-family: monospace;
        }
        .post-body {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        .post-image {
            max-width: 180px;
            max-height: 180px;
            object-fit: contain;
            border: 1px solid #ddd;
        }
        .reply-image {
            max-width: 140px;
            max-height: 140px;
            object-fit: contain;
            border: 1px solid #ddd;
        }
        .post-text {
            font-size: 0.9rem;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        
        /* Replies Section */
        .replies-container {
            margin-left: 20px;
            border-left: 2px solid #eee;
            padding-left: 15px;
        }
        .reply {
            background-color: var(--bg-cream);
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
        }
        .reply-body {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }
        .reply-form {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .reply-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 class="brand-title">The Olit UK</h1>
    </div>

    <nav class="global-nav">
        <a href="uk.html">The Olit UK</a> • 
        <a href="world.html">The Olit World</a> • 
        <a href="discussion.html" style="text-decoration: underline; color: #b22222;">Discussion Board</a>
    </nav>

    <div class="main-container">
        
        <!-- New Thread Form -->
        <div class="new-thread-box">
            <h3>Start a New Thread (Max 5 Active Threads)</h3>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="thread-subject" placeholder="Thread topic...">
            </div>
            <div class="form-group">
                <label>Comment</label>
                <textarea id="thread-comment" rows="3" placeholder="Write your post..."></textarea>
            </div>
            <div class="form-group">
                <label>Upload Image (Optional)</label>
                <input type="file" id="thread-image-file" accept="image/*">
            </div>
            <button class="btn-submit" onclick="createThread()">Post Thread</button>
        </div>

        <!-- Threads Container -->
        <div id="threads-wrapper"></div>

    </div>

    <script>
        const MAX_THREADS = 5;

        let threads = [
            {
                id: 1001,
                subject: "Regional Infrastructure Priorities",
                name: "Anonymous",
                date: "Thu, 05 Nov 12:00:00",
                comment: "What are the key regional transit updates needed across the UK this quarter?",
                image: "images/northe_sea_gas.jpg",
                replies: [
                    {
                        id: 1002,
                        name: "Anonymous",
                        date: "Thu, 05 Nov 12:05:00",
                        comment: "Focusing on east-west rail connectivity in the Midlands should be prioritized.",
                        image: null
                    }
                ]
            }
        ];

        function renderThreads() {
            const wrapper = document.getElementById('threads-wrapper');
            wrapper.innerHTML = '';

            threads.forEach((thread) => {
                const threadEl = document.createElement('div');
                threadEl.className = 'thread';

                let imgHtml = thread.image ? `<img src="${thread.image}" class="post-image" alt="Uploaded Image">` : '';

                let repliesHtml = thread.replies.map(reply => {
                    let replyImgHtml = reply.image ? `<img src="${reply.image}" class="reply-image" alt="Reply Image">` : '';
                    return `
                        <div class="reply">
                            <div class="post-header">
                                <span class="poster-name">${reply.name}</span> 
                                <span>${reply.date}</span> 
                                <span class="post-number">No.${reply.id}</span>
                            </div>
                            <div class="reply-body">
                                ${replyImgHtml}
                                <div class="post-text">${reply.comment}</div>
                            </div>
                        </div>
                    `;
                }).join('');

                threadEl.innerHTML = `
                    <div class="post-header">
                        <span class="post-subject">${thread.subject}</span> 
                        <span class="poster-name">${thread.name}</span> 
                        <span>${thread.date}</span> 
                        <span class="post-number">No.${thread.id}</span>
                    </div>
                    <div class="post-body">
                        ${imgHtml}
                        <div class="post-text">${thread.comment}</div>
                    </div>
                    <div class="replies-container">
                        ${repliesHtml}
                        <div class="reply-form">
                            <div class="reply-inputs">
                                <input type="text" id="reply-text-${thread.id}" style="flex:1; padding:6px;" placeholder="Write a reply...">
                                <button class="btn-submit" onclick="addReply(${thread.id})">Reply</button>
                            </div>
                            <div>
                                <input type="file" id="reply-image-file-${thread.id}" accept="image/*" style="font-size:0.75rem;">
                            </div>
                        </div>
                    </div>
                `;

                wrapper.appendChild(threadEl);
            });
        }

        function createThread() {
            const subject = document.getElementById('thread-subject').value.trim();
            const comment = document.getElementById('thread-comment').value.trim();
            const fileInput = document.getElementById('thread-image-file');
            const file = fileInput.files[0];

            if (!comment) {
                alert('Comment text is required to post a thread.');
                return;
            }

            const processThread = (imageDataUrl = null) => {
                if (threads.length >= MAX_THREADS) {
                    threads.pop();
                }

                const newThread = {
                    id: Math.floor(100000 + Math.random() * 900000),
                    subject: subject || 'Untitled',
                    name: 'Anonymous',
                    date: new Date().toUTCString().slice(0, 22),
                    comment: comment,
                    image: imageDataUrl,
                    replies: []
                };

                threads.unshift(newThread);

                // Reset Form
                document.getElementById('thread-subject').value = '';
                document.getElementById('thread-comment').value = '';
                fileInput.value = '';

                renderThreads();
            };

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processThread(e.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                processThread();
            }
        }

        function addReply(threadId) {
            const textInput = document.getElementById(`reply-text-${threadId}`);
            const comment = textInput.value.trim();
            const fileInput = document.getElementById(`reply-image-file-${threadId}`);
            const file = fileInput.files[0];

            if (!comment && !file) {
                alert('Please provide a comment or an image to reply.');
                return;
            }

            const processReply = (imageDataUrl = null) => {
                const thread = threads.find(t => t.id === threadId);
                if (thread) {
                    thread.replies.push({
                        id: Math.floor(100000 + Math.random() * 900000),
                        name: 'Anonymous',
                        date: new Date().toUTCString().slice(0, 22),
                        comment: comment,
                        image: imageDataUrl
                    });
                    renderThreads();
                }
            };

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processReply(e.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                processReply();
            }
        }

        renderThreads();
    </script>
</body>
</html>
